<!DOCTYPE html>
<html lang="en">
<head>

  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8222208732348820"
     crossorigin="anonymous"></script>
     
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login | KavyaHub</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/responsive.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
</head>
<body>

  <main style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;">
    <div class="resource-card" style="width: 100%; max-width: 420px; padding: 35px; background: var(--card-solid); border: 1px solid var(--border); box-shadow: var(--shadow); border-radius: 24px;">
      
      <div style="text-align: center; margin-bottom: 25px;">
        <h2 style="font-size: 1.8rem; font-weight: 800; color: var(--text-main);">Kavya<span>Hub</span> Control</h2>
        <p style="color: var(--text-light); font-size: 0.9rem; margin-top: 5px;">Secure Administrator Gateway</p>
      </div>

      <form id="loginForm" style="display: flex; flex-direction: column; gap: 18px;">
        <div style="display: flex; flex-direction: column; gap: 6px;">
          <label style="font-weight: 600; font-size: 0.9rem; color: var(--text-main);">Admin Email</label>
          <div class="search-box" style="padding: 12px 16px; border-radius: 12px;">
            <i class="fa-solid fa-envelope" style="color: var(--primary);"></i>
            <input type="email" id="loginEmail" placeholder="Enter admin email" required autocomplete="username" />
          </div>
        </div>

        <div style="display: flex; flex-direction: column; gap: 6px;">
          <label style="font-weight: 600; font-size: 0.9rem; color: var(--text-main);">Password</label>
          <div class="search-box" style="padding: 12px 16px; border-radius: 12px;">
            <i class="fa-solid fa-lock" style="color: var(--primary);"></i>
            <input type="password" id="loginPassword" placeholder="Enter secure key" required autocomplete="current-password" />
          </div>
        </div>

        <button type="submit" class="unlock-btn" style="margin-top: 10px; font-weight: 700;">
          Verify & Authenticate
        </button>
      </form>

    </div>
  </main>

 <!-- 1. Supabase SDK Core Library (CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <!-- 2. Tumhari Database Configuration Credentials -->
  <script src="supabase/config.js"></script> 
  
  <!-- 3. Tumhara Login functionality interface script -->
  <script src="js/login.js"></script>
</body>
</html>
